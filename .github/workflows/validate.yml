name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nomad 2.1.1 and nomad-pack 0.4.2
        run: make install-tools
      - name: Render and nomad job validate
        run: make validate
